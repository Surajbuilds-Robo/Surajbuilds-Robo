name: Update Profile Art & Heatmap

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate Baseline Photo if Missing
        run: |
          if [ ! -f "my.jpg" ]; then
            python -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (400, 400), color=(20, 24, 33))
          draw = ImageDraw.Draw(img)
          draw.ellipse((50, 50, 350, 350), fill=(45, 55, 72))
          draw.ellipse((140, 90, 260, 210), fill=(230, 235, 245))
          draw.ellipse((80, 230, 320, 450), fill=(230, 235, 245))
          img.save('my.jpg', 'JPEG')
          "
          fi

      - name: Preprocess Photo
        run: python scripts/prep_photo.py my.jpg source-prepped.png

      - name: Render Animated ASCII SVG
        run: python scripts/make_ascii_svg.py

      - name: Render Animated Neofetch Info Card
        run: python scripts/make_info_card.py

      - name: Fetch GitHub Contribution Metrics
        run: python scripts/fetch_contributions.py ${{ github.repository_owner }}

      - name: Render Animated Contribution Heatmap SVG
        run: python scripts/render_heatmap_svg.py data/contributions.json contrib-heatmap.svg

      - name: Commit and Push Updated Artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): auto-update animated SVGs & contribution metrics [skip ci]"
          file_pattern: "*.svg data/*.json source-prepped.png"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
