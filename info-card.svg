<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 416" width="540" height="416">
  <defs>
    <!-- Dark Mode Terminal Background Gradient -->
    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Cyan Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .card-bg {
        fill: url(#card-bg-grad);
        stroke: #30363d;
        stroke-width: 1.5px;
        rx: 10px;
        ry: 10px;
      }
      .card-header {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }

      .header-title {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px;
        fill: #8b949e;
        font-weight: 600;
      }

      .user-prompt {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 14px;
        fill: #58a6ff;
        font-weight: 700;
        filter: url(#cyan-glow);
      }

      .separator {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #484f58;
      }

      .key-label {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #79c0ff;
        font-weight: 600;
      }

      .value-text {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #c9d1d9;
      }

      .accent-highlight {
        fill: #39d353;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect class="card-bg" x="0.75" y="0.75" width="538.5" height="414.5" />

  <!-- Header Bar -->
  <path class="card-header" d="M 0.75,10 A 10,10 0 0,1 10.75,0.75 L 529.25,0.75 A 10,10 0 0,1 539.25,10 L 539.25,34 L 0.75,34 Z" />

  <!-- Window Dots -->
  <circle class="dot-red" cx="18" cy="17" r="5.5" />
  <circle class="dot-yellow" cx="34" cy="17" r="5.5" />
  <circle class="dot-green" cx="50" cy="17" r="5.5" />

  <text class="header-title" x="270.0" y="21" text-anchor="middle">neofetch --sysinfo</text>

  <!-- Content Container -->
  <g transform="translate(24, 55)">
    <g opacity="0" transform="translate(0, 0)">
      <text class="user-prompt" x="0" y="0">suraj@developer-box</text>
      <animate attributeName="opacity" to="1" dur="0.25s" begin="0.2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-10, 0" to="0, 0" dur="0.25s" begin="0.2s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 24)">
      <text class="separator" x="0" y="0">----------------------------------------</text>
      <animate attributeName="opacity" to="1" dur="0.25s" begin="0.35s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 48)">
      <text class="key-label" x="0" y="0">OS:         </text>
      <text class="value-text" x="105" y="0">Linux x86_64 (Arch / Fedora)</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 48" to="0, 48" dur="0.2s" begin="0.5s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 72)">
      <text class="key-label" x="0" y="0">HOST:       </text>
      <text class="value-text" x="105" y="0">GitHub Profile v2.5.0</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="0.65s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 72" to="0, 72" dur="0.2s" begin="0.65s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 96)">
      <text class="key-label" x="0" y="0">ROLE:       </text>
      <text class="value-text" x="105" y="0">Senior Full-Stack & AI Engineer</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="0.8s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 96" to="0, 96" dur="0.2s" begin="0.8s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 120)">
      <text class="key-label" x="0" y="0">EDUCATION:  </text>
      <text class="value-text" x="105" y="0">B.S. in Computer Science</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="0.95s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 120" to="0, 120" dur="0.2s" begin="0.95s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 144)">
      <text class="key-label" x="0" y="0">LANGUAGES:  </text>
      <text class="value-text" x="105" y="0">Python, TypeScript, Rust, C++, SQL</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.1s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 144" to="0, 144" dur="0.2s" begin="1.1s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 168)">
      <text class="key-label" x="0" y="0">FRAMEWORKS: </text>
      <text class="value-text" x="105" y="0">Next.js, React, FastAPI, PyTorch, Tailwind</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.25s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 168" to="0, 168" dur="0.2s" begin="1.25s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 192)">
      <text class="key-label" x="0" y="0">DATABASE:   </text>
      <text class="value-text" x="105" y="0">PostgreSQL, Redis, VectorDB (Qdrant)</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.4s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 192" to="0, 192" dur="0.2s" begin="1.4s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 216)">
      <text class="key-label" x="0" y="0">TOOLS:      </text>
      <text class="value-text" x="105" y="0">Git, Docker, Kubernetes, Neovim, Linux</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.55s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 216" to="0, 216" dur="0.2s" begin="1.55s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 240)">
      <text class="key-label" x="0" y="0">LEARNING:   </text>
      <text class="value-text" x="105" y="0">LLM Fine-Tuning & Quantization, WebGPU</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.7s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 240" to="0, 240" dur="0.2s" begin="1.7s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 264)">
      <text class="key-label" x="0" y="0">PROJECTS:   </text>
      <text class="value-text" x="105" y="0">AI Agent Framework, Open Source Contributor</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="1.85s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 264" to="0, 264" dur="0.2s" begin="1.85s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 288)">
      <text class="key-label" x="0" y="0">WEBSITE:    </text>
      <text class="value-text" x="105" y="0">https://alex-dev.portfolio.io</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="2.0s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 288" to="0, 288" dur="0.2s" begin="2.0s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 312)">
      <text class="key-label" x="0" y="0">STATUS:     </text>
      <text class="value-text accent-highlight" x="105" y="0">🟢 Open for high-impact collaborations</text>
      <animate attributeName="opacity" to="1" dur="0.2s" begin="2.15s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="-8, 312" to="0, 312" dur="0.2s" begin="2.15s" fill="freeze" />
    </g>
  </g>
</svg>
